[functions]

# Every one of these is reached by a visitor with no account. SPEC 2: there is
# no login in this product and a token in the URL is the only authority. With
# verify_jwt on, Supabase would reject the request before the function ever saw
# the token.

[functions.submit-test]
verify_jwt = false

[functions.get-report-by-token]
verify_jwt = false

[functions.get-report-ai]
verify_jwt = false

[functions.request-contact]
verify_jwt = false

# Called from the report page by someone with no account.
[functions.create-checkout]
verify_jwt = false

# Stripe calls this. Its own signature is the authority, not a JWT.
[functions.stripe-webhook]
verify_jwt = false

# pg_cron calls this hourly, with CRON_SECRET.
[functions.dispatch-daily]
verify_jwt = false

# Reached from a signed link in an email.
[functions.submit-answer]
verify_jwt = false

# Reached from a signed link in an email.
[functions.get-day-by-signed]
verify_jwt = false

# pg_cron calls this hourly, with CRON_SECRET.
[functions.dispatch-final]
verify_jwt = false

# Reached with the final report token.
[functions.get-final-by-token]
verify_jwt = false
